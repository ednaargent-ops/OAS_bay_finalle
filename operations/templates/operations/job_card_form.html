{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}New job card — OAS Bay{% endblock %}
{% block content %}
<h1 class="h4 mb-3"><i class="bi bi-clipboard2-plus"></i> New job card for {{ customer.full_name }}</h1>
<div class="card p-4" style="max-width: 560px;">
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary mt-2"><i class="bi bi-check-lg"></i> Open job card</button>
  </form>
</div>
{% endblock %}
