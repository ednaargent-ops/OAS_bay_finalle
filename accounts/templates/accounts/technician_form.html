{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}New technician — OAS Bay{% endblock %}
{% block content %}
<h1 class="h4 mb-3"><i class="bi bi-person-plus"></i> New technician</h1>
<div class="card p-4" style="max-width: 480px;">
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary mt-2"><i class="bi bi-check-lg"></i> Add technician</button>
  </form>
</div>
{% endblock %}
